name: KastelUtils
version: 26.8.1
main: me.KastelUtils.KastelUtils
api-version: '1.21'
author: IAmRiven
description: Permite personalizar el cooldown del firework con elytra y mostrar partículas al planear.
commands:
  kastelutils:
    description: Comando principal de KastelUtils.
    usage: /<command> reload|changelog <versión|create|edit|list|latest|view>
    aliases: [kutils, kastelreload]
permissions:
  kastelutils.reload:
    description: Permite recargar la configuración del plugin KastelUtils.
    default: op
  kastelutils.changelog:
    description: Permite crear y publicar changelogs del servidor.
    default: op
  kastelutils.changelog.view:
    description: Permite listar y consultar changelogs publicados.
    default: op